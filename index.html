<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Playground</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Particle Playground</h1>
    <p class="subtitle">Move your mouse. Click. Try the modes below.</p>
  </header>

  <canvas id="canvas"></canvas>

  <div id="ui">
    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="gravity">Gravity Well</button>
      <button class="mode-btn" data-mode="repel">Repel</button>
      <button class="mode-btn" data-mode="swirl">Swirl</button>
      <button class="mode-btn" data-mode="fireworks">Fireworks</button>
    </div>

    <div class="sliders">
      <label>
        Particle count
        <input type="range" id="countSlider" min="50" max="800" value="300">
        <span id="countValue">300</span>
      </label>
      <label>
        Force strength
        <input type="range" id="forceSlider" min="1" max="20" value="8">
        <span id="forceValue">8</span>
      </label>
    </div>

    <div class="palette">
      <button class="palette-btn" data-palette="neon" style="background: linear-gradient(90deg,#ff00ea,#00fff9)">Neon</button>
      <button class="palette-btn active" data-palette="sunset" style="background: linear-gradient(90deg,#ff5f6d,#ffc371)">Sunset</button>
      <button class="palette-btn" data-palette="ocean" style="background: linear-gradient(90deg,#00c6ff,#0072ff)">Ocean</button>
      <button class="palette-btn" data-palette="mono" style="background: linear-gradient(90deg,#f5f5f5,#333333)">Mono</button>
    </div>

    <button id="clearBtn">Clear trails</button>
  </div>

  <footer>
    <p>Click anywhere to burst particles &middot; Built with HTML5 Canvas</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
